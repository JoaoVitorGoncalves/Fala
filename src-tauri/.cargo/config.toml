# No Windows com MSVC: o cmake-rs substitui CMAKE_<LANG>_FLAGS_RELEASE pelas
# flags base do cargo quando ninguém as define (~60x mais lento na inferência).
# Usar CMAKE_GENERATOR_<target> + CMAKE_PROJECT_INCLUDE mantém o Windows com
# Ninja + /O2 + AVX2/FMA/F16C/SSE42 e deixa o macOS livre para Unix Makefiles + Metal.
[env]
CMAKE_GENERATOR_x86_64_pc_windows_msvc = "Ninja"
CMAKE_PROJECT_INCLUDE = { value = "cmake/windows-flags.cmake", relative = true }
